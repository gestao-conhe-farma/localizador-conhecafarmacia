# =============================================================================
# Backup semanal da base de dados do Localizador
#
# ESTE É O ÚNICO BACKUP QUE EXISTE. O projecto Supabase está no plano
# gratuito, que não tem backups automáticos nem recuperação point-in-time
# (§9.1 de docs/2026-10-28-contas-utilizador-partilhadas.md). Se este
# workflow parar de correr, ou se o dump nunca tiver sido restaurado, uma
# migração mal aplicada passa a ser perda definitiva.
#
# Correr à mão: Actions → «backup-db» → Run workflow.
#
# O dump é `pg_dump -Fc`: formato personalizado e comprimido, e só com os
# esquemas `public` e `localizador` (os que a aplicação possui). Os esquemas
# geridos pela Supabase — `auth`, `storage`, `realtime`, `extensions` — ficam
# de fora de propósito: são da plataforma e não se restauram à mão. O cliente
# é o 17 do PGDG porque o servidor é PostgreSQL 17 — o cliente 16 do Ubuntu
# recusa com «server version mismatch».
#
# O artefacto guarda-se 90 dias, que é a retenção máxima no GitHub: o dump
# mais antigo que existe tem, no máximo, 90 dias.
#
# PROVA DE RESTAURO — repetir uma vez por trimestre, com o ficheiro descarregado
# do artefacto (Tasks 1.5 e 1.6 do plano):
#
#   pg_restore -l backup-<data>.dump                          # o índice abre
#   pg_restore -l backup-<data>.dump | grep -c 'TABLE localizador'   # 26
#   pg_restore -l backup-<data>.dump | grep -c 'TABLE public'        # 64
#   pg_restore --clean --if-exists --no-owner --no-privileges \
#     -d "$TARGET_DB_URL" backup-<data>.dump
#
# Um backup que nunca foi restaurado não é um backup: o `--clean --if-exists`
# faz o restauro correr sobre uma base já usada, que é o caso real. O
# `--no-owner` evita que o restauro tente devolver as tabelas a `postgres`
# quando corre numa base onde esse papel não existe.
#
# Segredo necessário: SUPABASE_DB_URL (Settings → Secrets and variables →
# Actions), com a connection string do session pooler e o papel de backup.
# Sem ele o job falha na primeira verificação, de propósito.
#
# Porque não é a connection string directa nem a password do `postgres`:
#
#   * `db.<ref>.supabase.co` só responde em IPv6 e os runners do GitHub não
#     têm IPv6. O caminho que funciona é o pooler em modo sessão — porta 5432
#     e não 6543, porque o `pg_dump` precisa de uma sessão inteira e o 6543 é
#     transaction mode.
#   * O papel é `backup_dumper` (LOGIN, `pg_read_all_data`, BYPASSRLS), criado
#     para este efeito: só lê, não pode escrever, e o dia em que a password do
#     `postgres` rodar o backup continua a correr. A password do `postgres`
#     nunca sai da Supabase.
#
#   postgresql://backup_dumper.<ref>:<password>@aws-0-eu-west-1.pooler.supabase.com:5432/postgres
# =============================================================================

name: backup-db

on:
  schedule:
    # Domingo, 03:00 UTC. Escolhido por ser a hora de menor uso em Luanda
    # (04:00 local) e por não colidir com o cron diário da reconfirmação.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump da base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Onde o alarme toca. O /interno é o sítio que a equipa já abre todos
      # os dias — um e-mail para uma caixa que ninguém lê não é um alarme.
      ALERTA_URL: https://localizador.conhecafarmacia.com/api/interno/alertas

    steps:
      - name: Confirmar o segredo
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Falta o segredo SUPABASE_DB_URL. Sem ele não há backup nenhum — configura-o em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Instalar o cliente PostgreSQL 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      - name: Dump
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%d)"
          echo "DUMP_NAME=backup-${stamp}.dump" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=localizador-db-${stamp}" >> "$GITHUB_ENV"
          pg_dump "$SUPABASE_DB_URL" -Fc \
            --schema=public --schema=localizador \
            -f "backup-${stamp}.dump"
          ls -lh "backup-${stamp}.dump"

      - name: Verificar que o dump abre e tem as tabelas dos dois esquemas
        run: |
          set -euo pipefail
          pg_restore -l "$DUMP_NAME" > /dev/null
          # `awk` e não `grep -c`: o `grep -c` devolve 1 quando não há
          # correspondências e o `set -e` abortava antes da mensagem legível.
          conta='TABLE localizador'
          tabelas="$(pg_restore -l "$DUMP_NAME" | awk -v alvo="$conta" 'index($0, alvo) { n++ } END { print n + 0 }')"
          echo "Tabelas no schema localizador: ${tabelas}"
          if [ "${tabelas}" -lt 25 ]; then
            echo "::error::O dump só tem ${tabelas} tabelas no schema localizador (esperadas 26). Não subir este artefacto como backup válido."
            exit 1
          fi
          # O `public` é a conta e o site: se ficar de fora, o backup é do
          # catálogo e não da base. 64 tabelas à data do dump de referência.
          conta='TABLE public'
          tabelas="$(pg_restore -l "$DUMP_NAME" | awk -v alvo="$conta" 'index($0, alvo) { n++ } END { print n + 0 }')"
          echo "Tabelas no schema public: ${tabelas}"
          if [ "${tabelas}" -lt 50 ]; then
            echo "::error::O dump só tem ${tabelas} tabelas no schema public (esperadas 64). Não subir este artefacto como backup válido."
            exit 1
          fi

      - name: Guardar o artefacto (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.DUMP_NAME }}
          retention-days: 90
          if-no-files-found: error

      # O alarme não toca sozinho. Quando o job falha, esta chamada põe o
      # aviso no painel /interno; a de baixo fecha-o quando tudo corre bem.
      # O `if: failure()` apanha também a falha do primeiro passo (o segredo
      # em falta), que é justamente o caso em que ninguém saberia de nada.
      - name: Abrir alerta no /interno
        if: failure()
        env:
          ALERTA_SEGREDO: ${{ secrets.INTERNO_ALERT_SECRET }}
        run: |
          if [ -z "${ALERTA_SEGREDO:-}" ]; then
            echo "::warning::Sem o segredo INTERNO_ALERT_SECRET o /interno não fica a saber que o backup falhou."
            exit 0
          fi
          corpo="$(jq -n \
            --arg kind backup \
            --arg state failed \
            --arg title 'O backup semanal falhou' \
            --arg body "A execução de $(date -u +%d/%m/%Y) não chegou ao fim. Enquanto este aviso estiver aberto, a base não tem backup desta semana." \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg dedupe "$GITHUB_RUN_ID" \
            '{kind:$kind, state:$state, title:$title, body:$body, url:$url, dedupe:$dedupe}')"
          curl -fsS -m 20 -X POST "$ALERTA_URL" \
            -H "Authorization: Bearer $ALERTA_SEGREDO" \
            -H 'Content-Type: application/json' \
            --data-binary "$corpo" \
            || echo "::warning::O /interno não recebeu o alerta — o painel vai continuar calado."

      # A execução verde fecha o aviso, e é a única coisa que o fecha: ninguém
      # tem de se lembrar de o apagar. Se a chamada falhar, o aviso fica
      # aberto de mais e não de menos — o erro é o lado seguro.
      - name: Fechar o alerta no /interno
        if: success()
        env:
          ALERTA_SEGREDO: ${{ secrets.INTERNO_ALERT_SECRET }}
        run: |
          if [ -z "${ALERTA_SEGREDO:-}" ]; then
            echo "::warning::Sem o segredo INTERNO_ALERT_SECRET não há alerta para fechar."
            exit 0
          fi
          curl -fsS -m 20 -X POST "$ALERTA_URL" \
            -H "Authorization: Bearer $ALERTA_SEGREDO" \
            -H 'Content-Type: application/json' \
            -d '{"kind":"backup","state":"ok"}' \
            || echo "::warning::O /interno não recebeu o fecho do alerta."
