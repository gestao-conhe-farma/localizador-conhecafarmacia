<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Imagens por categoria — Conheça Farmácia</title>
<style>
  :root { --verde: #00493a; }
  body { margin: 0; padding: 40px; font-family: system-ui, sans-serif; background: #fff; color: #1a1a1a; }
  h1 { font-size: 20px; color: var(--verde); margin: 0 0 24px; }
  .grelha { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
  figure { margin: 0; border: 1px solid #e6e6e6; border-radius: 10px; overflow: hidden; }
  img { display: block; width: 100%; height: auto; background: #fff; }
  figcaption { padding: 10px 12px; font-size: 13px; color: var(--verde); border-top: 1px solid #e6e6e6; }
</style>
</head>
<body>
<h1>Imagens por categoria — 1600×1200, fundo #FFFFFF</h1>
<div class="grelha">
  <figure><img src="frasco.webp" alt="Frasco"><figcaption>Frasco</figcaption></figure>
  <figure><img src="bisnaga.webp" alt="Bisnaga"><figcaption>Bisnaga</figcaption></figure>
  <figure><img src="boiao.webp" alt="Boião"><figcaption>Boião</figcaption></figure>
  <figure><img src="injetavel.webp" alt="Injetável"><figcaption>Injetável</figcaption></figure>
  <figure><img src="inalador.webp" alt="Inalador"><figcaption>Inalador</figcaption></figure>
  <figure><img src="pacote.webp" alt="Pacote"><figcaption>Pacote</figcaption></figure>
  <figure><img src="biberao.webp" alt="Biberão"><figcaption>Biberão</figcaption></figure>
  <figure><img src="caixa.webp" alt="Caixa"><figcaption>Caixa</figcaption></figure>
</div>
</body>
</html>
